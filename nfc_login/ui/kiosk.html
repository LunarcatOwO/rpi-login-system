<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFC Sign In</title>
<style>
/* Laid out for the 5 inch 800x480 touchscreen, like the Tkinter kiosk. */
:root {
  --bg: #101418; --panel: #1b2129; --tab: #262e38; --text: #e8edf2; --muted: #8a97a6;
  --info: #4aa3ff; --success: #3ccf7a; --warning: #f2b33d; --error: #ff5c5c; --prompt: #c58cff;
  --line: #29323d; --soft: #cfd8e2; --accent: var(--info);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --sans: "DejaVu Sans", "Noto Sans", system-ui, sans-serif;
  --mono: "DejaVu Sans Mono", "Noto Sans Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--sans); overflow: hidden; user-select: none;
  -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; animation: fade-in .4s var(--ease); }
@keyframes fade-in { from { opacity: 0; } }
body.kiosk { cursor: none; }
header, footer { background: var(--panel); display: flex; align-items: center; padding: 0 12px; }
header { height: 42px; gap: 16px; box-shadow: inset 0 -1px var(--line); }
header .name { font-weight: bold; font-size: 20px; flex: 1; letter-spacing: .01em;
  display: flex; align-items: center; gap: 9px; }
/* A small mark in the colour of what's on screen. */
header .name::before { content: ""; width: 10px; height: 10px; border-radius: 3px;
  background: var(--accent); transition: background-color .35s var(--ease); }
header .season { color: var(--muted); font-size: 17px; }
header .update { display: none; color: var(--info); font-size: 14px; align-items: center; gap: 4px;
  padding: 3px 9px 3px 7px; border-radius: 999px; background: rgba(74, 163, 255, .14); }
header .update.on { display: flex; animation: pop-in .35s var(--ease); }
@keyframes pop-in { from { opacity: 0; transform: scale(.85); } }
header .clock { font-size: 20px; font-variant-numeric: tabular-nums; }
main { flex: 1; display: flex; min-height: 0; }
.status { flex: 1; padding: 14px 16px 14px 24px; min-width: 0; display: flex; flex-direction: column;
  position: relative; }
/* A bar down the left edge in the screen's colour (success green, error red, ...). */
.status::before { content: ""; position: absolute; left: 10px; top: 18px; bottom: 18px; width: 4px;
  border-radius: 2px; background: var(--accent); transition: background-color .35s var(--ease); }
.status h1 { margin: 0; font-size: 31px; line-height: 1.2; overflow-wrap: anywhere;
  display: flex; align-items: center; gap: 14px; letter-spacing: -.005em; }
#title { color: var(--accent); transition: color .35s var(--ease); min-width: 0; }
/* While the kiosk waits on something (Wi-Fi, an update): dots that chase round a
   circle, like Windows'. Only transform and opacity move, so it's cheap on a Pi. */
.spinner { --size: 28px; --dot: 4px; position: relative; width: var(--size); height: var(--size);
  flex: none; color: var(--accent); display: none; }
.busy .spinner, .spinner.on { display: block; }
.spinner i { position: absolute; inset: 0; opacity: 0; animation: orbit 5.5s infinite; }
.spinner i::after { content: ""; position: absolute; left: 50%; top: 0; width: var(--dot);
  height: var(--dot); margin-left: calc(var(--dot) / -2); border-radius: 50%; background: currentColor; }
.spinner i:nth-child(2) { animation-delay: .24s; }
.spinner i:nth-child(3) { animation-delay: .48s; }
.spinner i:nth-child(4) { animation-delay: .72s; }
.spinner i:nth-child(5) { animation-delay: .96s; }
@keyframes orbit {
  0% { transform: rotate(225deg); opacity: 1; animation-timing-function: ease-out; }
  7% { transform: rotate(345deg); animation-timing-function: linear; }
  30% { transform: rotate(455deg); animation-timing-function: ease-in-out; }
  39% { transform: rotate(690deg); animation-timing-function: linear; }
  70% { transform: rotate(815deg); opacity: 1; animation-timing-function: ease-out; }
  75% { transform: rotate(945deg); animation-timing-function: ease-out; }
  76%, 100% { transform: rotate(945deg); opacity: 0; }
}
/* A result screen's time left before the start screen comes back. */
.hold { position: absolute; left: 24px; right: 16px; bottom: 8px; height: 3px; border-radius: 2px;
  background: var(--line); overflow: hidden; opacity: 0; transition: opacity .3s; }
.hold.on { opacity: 1; }
.hold i { display: block; height: 100%; background: var(--accent); transform-origin: left; }
/* The screen's lines (drawLines). Too many for the screen scroll by touch. */
.status .lines { margin-top: 12px; font-size: 18px; line-height: 1.35; min-height: 0;
  overflow: hidden auto; overscroll-behavior: contain; display: flex; flex-direction: column;
  scrollbar-width: none; }
.lines p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--soft); }
.lines p.gap { height: 8px; }
aside { width: 340px; margin: 10px 10px 10px 0; background: var(--panel); display: flex;
  flex-direction: column; min-height: 0; border-radius: 10px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--line); }
.tabs { display: flex; position: relative; box-shadow: inset 0 -1px var(--line); }
.tabs button { flex: 1; font: bold 16px var(--sans); border: 0; padding: 10px 0; background: none;
  color: var(--muted); cursor: inherit; transition: color .25s var(--ease); }
.tabs button.on { color: var(--text); }
/* The underline slides to the tab that's showing. */
.tabs .ink { position: absolute; left: 0; bottom: 0; width: 50%; height: 3px; border-radius: 2px;
  background: var(--info); transition: transform .3s var(--ease); }
.tabs.board .ink { transform: translateX(100%); }
/* A list longer than the panel scrolls: by itself (autoScroll), or by touch. */
#side { flex: 1; min-height: 0; overflow: hidden auto; overflow-anchor: none;
  overscroll-behavior: contain; }
#side::-webkit-scrollbar { width: 4px; }
#side::-webkit-scrollbar-thumb { background: #3a4552; border-radius: 2px; }
table { border-collapse: collapse; margin: 6px 8px; font: 14px/1.45 var(--mono); width: calc(100% - 16px);
  table-layout: fixed; }
td { white-space: nowrap; overflow: hidden; padding: 0; }
td.r { text-align: right; }
td.rank { padding-right: .5ch; }
td.team { padding-left: .8ch; }
/* A name too long for its column slides sideways to show its end (fitNames). */
td.nm span { display: inline-block; }
@media (prefers-reduced-motion: reduce) {
  td.nm { text-overflow: ellipsis; }
  td.nm span { display: inline; }
}
tr.new td { animation: arrive 1.8s var(--ease); }
@keyframes arrive { from { background: rgba(60, 207, 122, .28); } }
.empty { color: var(--muted); padding: 8px 10px; font-size: 15px; }
footer { height: 36px; justify-content: space-between; gap: 12px; }
footer .entry { font: bold 22px var(--mono); color: var(--prompt); white-space: nowrap; }
footer .hint { color: var(--muted); font-size: 13px; white-space: pre; overflow: hidden; }
.sim { display: none; background: #2a1f00; color: #ffd27a; padding: 4px 8px; gap: 6px;
  align-items: center; font-size: 13px; }
.sim.on { display: flex; }
.sim input { width: 160px; font: 13px var(--mono); }
/* On-screen keyboard for names and Wi-Fi passwords; it takes the side panel's room,
   and sits at the bottom so the text above gives way first, never the keys. */
.kbd { display: none; margin-top: auto; padding-top: 8px; flex-direction: column; gap: 4px;
  flex-shrink: 0; }
body.typing .kbd { display: flex; }
body.typing aside { display: none; }
.kbd div { display: flex; gap: 4px; }
.kbd button, .kbd span { flex: 2 1 0; min-width: 0; height: 46px; }
.kbd button { font: bold 20px var(--sans); border: 0; border-radius: 6px; padding: 0;
  background: var(--tab); color: var(--text); cursor: inherit;
  transition: background-color .12s, transform .08s; }
.kbd button.word { font-size: 17px; }
.kbd button:active { background: var(--panel); transform: scale(.96); }
.kbd button.done { background: var(--success); color: var(--bg); }
.kbd button.on { background: var(--info); color: var(--bg); }
.offline { position: fixed; inset: auto 0 0 auto; margin: 8px; padding: 6px 12px 6px 10px;
  border-radius: 8px; background: #3a1d22; box-shadow: 0 0 0 1px var(--error); color: #ffd5d5;
  font-size: 13px; display: none; align-items: center; gap: 10px; }
.offline.on { display: flex; animation: pop-in .3s var(--ease); }
.offline .spinner { --size: 18px; --dot: 3px; color: var(--error); }
</style>
</head>
<body>
<header>
  <span class="name">NFC Sign In</span>
  <span class="season" id="season"></span>
  <span class="update" id="update" title="A newer version is on GitHub">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>
    Update
  </span>
  <span class="clock" id="clock"></span>
</header>
<main>
  <section class="status" id="status">
    <h1><span id="title"></span><span class="spinner" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></h1>
    <div class="lines" id="lines"></div>
    <div class="kbd" id="kbd"></div>
    <div class="hold" id="hold"><i></i></div>
  </section>
  <aside>
    <div class="tabs" id="tabs">
      <button id="tab-here" class="on">Here now</button>
      <button id="tab-board">Leaderboard</button>
      <span class="ink"></span>
    </div>
    <div id="side"></div>
  </aside>
</main>
<footer>
  <span class="entry" id="entry"></span>
  <span class="hint" id="hint"></span>
</footer>
<div class="sim" id="sim">
  SIMULATOR card UID: <input id="uid" value="04A1B2C3D4E5F6">
  <button id="tap">Tap card</button> Enter=#  Backspace/Esc=*
</div>
<div class="offline" id="offline"><span class="spinner on" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Kiosk service not responding, reconnecting…</div>

<script>
const $ = id => document.getElementById(id);
const TONES = ["info", "success", "warning", "error", "prompt"];
const still = matchMedia("(prefers-reduced-motion: reduce)");
let tab = "here", side = null;
let kbMode = null, kbPage = "letters", kbShift = false;   // the on-screen keyboard

if (new URLSearchParams(location.search).has("kiosk")) document.body.classList.add("kiosk");

function post(path, data) {
  return fetch(path, { method: "POST", body: new URLSearchParams(data) }).catch(() => {});
}

let shown = null;   // the screen showing: a new one slides in (enter)

function showScreen(s) {
  const fresh = !shown || shown.title !== s.title || shown.tone !== s.tone;
  shown = s;
  $("title").textContent = s.title;
  document.documentElement.style.setProperty(
    "--accent", TONES.includes(s.tone) ? `var(--${s.tone})` : "var(--text)");
  $("status").classList.toggle("busy", !!s.busy);
  drawLines(s.lines);
  holdBar(fresh ? s.hold : undefined);
  if (fresh) enter();
  $("entry").textContent = s.entry === null ? "" : "> " + s.entry;
  // Older kiosks sent keyboard: true for the name keyboard.
  const mode = typeof s.keyboard === "string" ? s.keyboard || null : (s.keyboard ? "name" : null);
  const letters = mode === "name" || mode === "text";
  if (mode !== kbMode) {   // a keyboard screen starts on the letters, unshifted
    kbMode = mode; kbPage = "letters"; kbShift = false;
    if (letters) drawKeys();
  }
  document.body.classList.toggle("typing", letters);
}

function typing() { return document.body.classList.contains("typing"); }

// A new screen fades and rises into place: the title, then its lines just after.
function enter() {
  if (still.matches) return;
  [$("title").parentNode, $("lines")].forEach((el, i) => el.animate(
    [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }],
    { duration: 260, delay: i * 50, easing: "cubic-bezier(.2, .7, .2, 1)", fill: "backwards" }));
}

// A result screen shows a thin bar that runs down until the start screen comes back.
// undefined: the same screen again, so the bar carries on.
function holdBar(seconds) {
  if (seconds === undefined) return;
  const bar = $("hold"), fill = bar.firstElementChild;
  fill.getAnimations().forEach(a => a.cancel());
  bar.classList.toggle("on", !!seconds);
  if (seconds) fill.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }],
                            { duration: seconds * 1000, easing: "linear", fill: "forwards" });
}

let drawnLines = null;
function drawLines(lines) {
  const sig = JSON.stringify(lines);
  if (sig === drawnLines) return;   // e.g. only the typed entry changed
  drawnLines = sig;
  $("lines").replaceChildren(...lines.map(line => {
    const p = document.createElement("p");
    if (line.trim()) p.textContent = line; else p.className = "gap";
    return p;
  }));
  $("lines").scrollTop = 0;
}

// On-screen keyboards, as rows of keys. "name" types people's names (letters go in
// lower case; the kiosk capitalises them). "text" is a full keyboard for Wi-Fi
// passwords: a one-shot Shift, and a 123 page of digits and symbols. One-character
// keys type themselves, "" is a half-key gap, longer labels are special keys.
const KEYBOARDS = {
  name: [[..."QWERTYUIOP"], [..."ASDFGHJKL'"], [..."ZXCVBNM-."], ["Space", "Delete", "Done"]],
  letters: [[..."qwertyuiop"], ["", ..."asdfghjkl", ""], ["Shift", ..."zxcvbnm", "Delete"],
            ["123", "Space", "Done"]],
  symbols: [[..."1234567890"], [..."-/:;()$&@\""], [...".,?!'#%*+="], [..."_\\|~<>{}[]^`"],
            ["ABC", "Space", "Delete", "Done"]],
};
const WEIGHTS = { "": 1, Shift: 3, Delete: 3, "123": 4, ABC: 4, Done: 4, Space: 8 };
const CHARS = { Space: " ", Delete: "back", Done: "done" };

function drawKeys() {
  const rows = kbMode === "name" ? KEYBOARDS.name : KEYBOARDS[kbPage];
  $("kbd").replaceChildren(...rows.map(row => {
    const line = document.createElement("div");
    for (const key of row) {
      const b = document.createElement(key ? "button" : "span");
      b.style.flexGrow = WEIGHTS[key] || 2;
      if (key) {
        b.textContent = kbShift && key.length === 1 ? key.toUpperCase() : key;
        if (key.length > 1) b.classList.add("word");
        if (key === "Done") b.classList.add("done");
        if (key === "Shift" && kbShift) b.classList.add("on");
        b.onclick = () => pressKey(key);
      }
      line.append(b);
    }
    return line;
  }));
}

function pressKey(key) {
  if (key === "Shift") kbShift = !kbShift;
  else if (key === "123" || key === "ABC") {
    kbPage = key === "123" ? "symbols" : "letters";
    kbShift = false;
  } else {
    let char = CHARS[key] || key;
    if (kbMode === "name") char = char.toLowerCase();
    else if (kbShift && /^[a-z]$/.test(char)) { char = char.toUpperCase(); kbShift = false; drawKeys(); }
    return sendChar(char);
  }
  drawKeys();
}

// One at a time, so fast typing reaches the kiosk in order.
let sending = Promise.resolve();
function sendChar(char) { sending = sending.then(() => post("/type", { char })); }
function sendKey(key) { sending = sending.then(() => post("/key", { key })); }

function setText(el, text) { if (el.textContent !== text) el.textContent = text; }

function cell(text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

// The side panel's list. Its rows are kept from one refresh to the next and only
// what changed is redrawn, so the scrolling and the sliding names carry on; the
// times are updated in place.
let view = null;   // what #side shows: {tab, empty} or {tab, tbody, *Col, rows}

function makeRow(r, sig) {
  const tr = document.createElement("tr");
  const name = document.createElement("span");
  name.textContent = r.name;
  const nameCell = cell("", "nm");
  nameCell.append(name);
  const time = cell(r.time, "r");
  if (tab === "board") tr.append(cell(r.rank, "r rank"));
  tr.append(cell(r.code), nameCell, cell(r.team, "team"), time);
  return { tr, sig, name, time, over: null, slide: null };
}

function setWidth(col, chars) {   // true if the column changed
  const width = chars + "ch";
  if (col.style.width === width) return false;
  col.style.width = width;
  return true;
}

function renderSide() {
  if (!side) return;
  setText($("tab-here"), `Here now (${side.here.length})`);
  $("tab-here").classList.toggle("on", tab === "here");
  $("tabs").classList.toggle("board", tab === "board");
  $("tab-board").classList.toggle("on", tab === "board");
  const rows = tab === "here" ? side.here : side.board;
  const box = $("side");
  if (!rows.length) {
    if (view && view.tab === tab && view.empty) return;
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = tab === "here" ? "Nobody signed in yet" : "No one yet";
    box.replaceChildren(p);
    view = { tab, empty: true };
    return;
  }
  const fresh = !view || view.tab !== tab || view.empty;   // nothing to highlight against
  if (fresh) {
    // Columns: [rank] code name team time. The name takes what the others leave.
    const table = document.createElement("table"), cols = document.createElement("colgroup");
    const col = width => cols.appendChild(Object.assign(document.createElement("col"),
                                                        { style: `width: ${width}` }));
    const rankCol = tab === "board" ? col("2.8ch") : null;
    col("5ch"); col("auto");
    const teamCol = col("8.8ch"), timeCol = col("8ch"), tbody = document.createElement("tbody");
    table.append(cols, tbody);
    box.replaceChildren(table);
    view = { tab, tbody, rankCol, teamCol, timeCol, rows: new Map() };
  }
  // The rank, team and time columns are as wide as their longest entry, plus a gap.
  const longest = key => Math.max(...rows.map(r => String(r[key]).length));
  let changed = setWidth(view.timeCol, longest("time") + 1);
  changed = setWidth(view.teamCol, Math.min(8, longest("team")) + 0.8) || changed;
  if (view.rankCol) changed = setWidth(view.rankCol, longest("rank") + 0.8) || changed;
  const next = new Map(), tbody = view.tbody;
  rows.forEach((r, i) => {
    let key = r.code;
    while (next.has(key)) key += "+";
    const sig = JSON.stringify([r.rank, r.code, r.name, r.team]);
    let row = view.rows.get(key);
    if (!row || row.sig !== sig) {
      // Someone who just signed in lights up for a moment.
      const arrived = !row && !fresh && tab === "here" && !still.matches;
      row = makeRow(r, sig);
      if (arrived) row.tr.className = "new";
      changed = true;
    }
    else setText(row.time, r.time);
    next.set(key, row);
    const here = tbody.children[i];
    if (here !== row.tr) { tbody.insertBefore(row.tr, here || null); changed = true; }
  });
  while (tbody.children.length > rows.length) { tbody.lastChild.remove(); changed = true; }
  view.rows = next;
  if (changed) fitNames();
}

// A name too long for its column shows its start for 2 s, slides (25 px a second)
// until its end shows, rests 2 s, jumps back, and again. Measured once laid out,
// and again whenever the panel changes size (hidden while typing, a scrollbar).
function fitNames() {
  if (!view || view.empty) return;
  for (const row of view.rows.values()) {
    const over = Math.ceil(row.name.offsetWidth - row.name.parentNode.clientWidth);
    if (over === row.over) continue;
    row.over = over;
    if (row.slide) row.slide.cancel();
    row.slide = null;
    if (over <= 0 || still.matches) continue;
    const hold = 2000, move = over / 25 * 1000, total = 2 * hold + move;
    const at = x => ({ transform: `translateX(${-x}px)` });
    row.slide = row.name.animate([
      { ...at(0), offset: 0 }, { ...at(0), offset: hold / total },
      { ...at(over), offset: (hold + move) / total }, { ...at(over), offset: 1 },
    ], { duration: total, iterations: Infinity });
  }
}
new ResizeObserver(fitNames).observe($("side"));
document.fonts.ready.then(fitNames);

// A list longer than the panel scrolls by itself, 20 px a second: a 3 s rest at the
// top, down to the end, 3 s there, back to the top. Someone touching, dragging or
// wheeling it pauses this for 20 s. With reduced motion it turns a panel at a time.
const auto = { phase: "top", since: 0, pos: 0, last: 0, pausedUntil: 0 };

function toTop(now) {
  $("side").scrollTop = 0;
  Object.assign(auto, { phase: "top", since: now, pos: 0, pausedUntil: 0 });
}

function autoScroll(now) {
  requestAnimationFrame(autoScroll);
  const dt = Math.min(now - auto.last, 100) / 1000;
  auto.last = now;
  const box = $("side"), max = box.scrollHeight - box.clientHeight;
  if (max < 1) {   // it all fits, or the panel is hidden
    Object.assign(auto, { phase: "top", since: now, pos: 0 });
    return;
  }
  if (now < auto.pausedUntil) return;
  if (auto.pausedUntil) {   // carry on from where it was left
    auto.pausedUntil = 0;
    auto.pos = box.scrollTop;
    auto.phase = auto.pos >= max - 1 ? "bottom" : "down";
    auto.since = now;
  }
  if (auto.phase === "top") {
    if (now - auto.since >= 3000) Object.assign(auto, { phase: "down", since: now });
  } else if (auto.phase === "down") {
    if (!still.matches) auto.pos += 20 * dt;
    else if (now - auto.since >= 6000) {
      auto.pos += box.clientHeight - 20;
      auto.since = now;
    }
    auto.pos = Math.min(auto.pos, max);
    if (Math.round(auto.pos) !== box.scrollTop) box.scrollTop = auto.pos;
    if (auto.pos >= max) Object.assign(auto, { phase: "bottom", since: now });
  } else if (now - auto.since >= 3000) {
    toTop(now);
  }
}
requestAnimationFrame(autoScroll);

function pauseAuto() { auto.pausedUntil = performance.now() + 20000; }
for (const type of ["pointerdown", "touchstart", "wheel"]) {
  $("side").addEventListener(type, pauseAuto, { passive: true });
}
// A flick keeps scrolling after the finger lifts: that counts as the person too.
$("side").addEventListener("scroll", () => { if (auto.pausedUntil) pauseAuto(); }, { passive: true });

function selectTab(t) {
  tab = t;
  renderSide();
  toTop(performance.now());
}

async function loadSide() {
  try {
    const res = await fetch("/api/kiosk", { cache: "no-store" });
    if (!res.ok) return;
    side = await res.json();
    setText($("season"), "Season " + side.season);
    const keys = side.keys.map(k => k.key).join("/");
    setText($("hint"), `No card? Type your ID: ${keys} + number` +
      (side.mentors ? ", mentors numbers only" : "") + "    * admin");
    $("sim").classList.toggle("on", side.simulated);
    $("update").classList.toggle("on", side.update);
    renderSide();
  } catch (e) { /* the event stream shows the offline notice */ }
}

$("tab-here").onclick = () => selectTab("here");
$("tab-board").onclick = () => selectTab("board");
$("tap").onclick = () => post("/tap", { uid: $("uid").value });

// The computer keyboard works as the keypad (handy in the simulator or with a USB keyboard).
document.addEventListener("keydown", e => {
  if (e.target === $("uid")) { if (e.key === "Enter") $("tap").click(); return; }
  if (typing() && e.key !== "Escape") {   // a USB keyboard types names and passwords too
    const char = { Enter: "done", Backspace: "back" }[e.key] || (e.key.length === 1 ? e.key : "");
    if (char) { e.preventDefault(); sendChar(char); }
    return;
  }
  const map = { Enter: "#", Backspace: "*", Escape: "*" };
  let key = map[e.key] || e.key.toUpperCase();
  if (key.length === 1 && "0123456789ABCD*#".includes(key)) { e.preventDefault(); sendKey(key); }
});

function connect() {
  const events = new EventSource("/events");
  events.onopen = () => { $("offline").classList.remove("on"); loadSide(); };
  events.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "screen") showScreen(msg.screen);
    if (msg.type === "refresh") loadSide();
  };
  events.onerror = () => $("offline").classList.add("on");   // EventSource retries by itself
}

function tick() { $("clock").textContent = new Date().toLocaleTimeString("en-GB"); }
tick();
setInterval(tick, 1000);
setInterval(loadSide, 5000);
connect();
</script>
</body>
