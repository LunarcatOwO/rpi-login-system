<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NFC Sign In</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #e8edf2;
    font-family: "DejaVu Sans", system-ui, sans-serif; cursor: none; overflow: hidden; }
  body { display: grid; place-items: center; }
  .box { width: 520px; }
  h1 { font-size: 28px; margin: 0 0 14px; }
  ul { list-style: none; padding: 0; margin: 0; font-size: 18px; }
  li { display: flex; gap: 12px; padding: 4px 0; }
  .icon { width: 1.2em; text-align: center; }
  .detail { color: #8a97a6; margin-left: auto; font-size: 15px; max-width: 260px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ok .icon { color: #3ccf7a; } .off .icon { color: #8a97a6; }
  .run .icon { color: #4aa3ff; } .fail .icon, .fail .detail { color: #ff5c5c; }
  .warn .icon { color: #f2b33d; }
  #message { color: #f2b33d; font-size: 16px; margin-top: 12px; min-height: 1.2em; }
  pre { color: #ff8f8f; font-size: 11px; white-space: pre-wrap; margin: 8px 0 0;
    max-height: 130px; overflow: hidden; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title">Starting the kiosk…</h1>
  <ul id="steps"></ul>
  <div id="message"></div>
  <pre id="log"></pre>
</div>
<script>
  // main.js calls setStatus() as each part of the system comes up.
  const ICONS = { wait: "○", run: "◌", ok: "✓", off: "–", warn: "!", fail: "✗" };
  window.setStatus = ({ title, steps, message, log }) => {
    document.getElementById("title").textContent = title;
    const list = document.getElementById("steps");
    list.replaceChildren();
    for (const s of steps) {
      const li = document.createElement("li");
      li.className = s.state;
      const icon = document.createElement("span");
      icon.className = "icon";
      icon.textContent = ICONS[s.state] || "○";
      const label = document.createElement("span");
      label.textContent = s.label;
      const detail = document.createElement("span");
      detail.className = "detail";
      detail.textContent = s.detail || "";
      li.append(icon, label, detail);
      list.append(li);
    }
    document.getElementById("message").textContent = message || "";
    document.getElementById("log").textContent = log || "";
  };
</script>
</body>
</html>
