<html lang="en">
<head>
<meta charset="utf-8">
<title>NFC Sign In</title>
<style>
  :root { --ease: cubic-bezier(.2, .7, .2, 1); }
  html, body { margin: 0; height: 100%; background: #101418; color: #e8edf2;
    font-family: "DejaVu Sans", system-ui, sans-serif; cursor: none; overflow: hidden;
    -webkit-font-smoothing: antialiased; }
  body { display: grid; place-items: center; animation: fade-in .4s var(--ease); }
  @keyframes fade-in { from { opacity: 0; } }
  .box { width: 520px; }
  .head { display: flex; align-items: center; gap: 16px; margin: 0 0 16px; }
  h1 { font-size: 28px; margin: 0; }
  ul { list-style: none; padding: 0; margin: 0; font-size: 18px; }
  li { display: flex; align-items: center; gap: 12px; padding: 4px 0; transition: color .3s; }
  li.wait { color: #8a97a6; }
  .icon { width: 1.2em; height: 1.2em; display: grid; place-items: center; }
  .icon b { animation: pop-in .3s var(--ease); font-weight: normal; }
  @keyframes pop-in { from { opacity: 0; transform: scale(.4); } }
  /* Four dots in a square that fold into a diagonal line and spring back,
     one diagonal then the other. --size sets the whole thing. */
  .spinner { --size: 40px; --u: calc(var(--size) * .2); position: relative;
    width: var(--size); height: var(--size); flex: none; color: #4aa3ff; }
  .spinner i { position: absolute; left: 50%; top: 50%; width: calc(var(--size) * .19);
    height: calc(var(--size) * .19); margin: calc(var(--size) * -.095); border-radius: 50%;
    background: currentColor; animation: 1.3s infinite; }
  /* resting square, for when animations are off */
  .spinner i:nth-child(1) { transform: translate(calc(var(--u) * -1), calc(var(--u) * -1)); animation-name: fold-1; }
  .spinner i:nth-child(2) { transform: translate(var(--u), calc(var(--u) * -1)); animation-name: fold-2; }
  .spinner i:nth-child(3) { transform: translate(calc(var(--u) * -1), var(--u)); animation-name: fold-3; }
  .spinner i:nth-child(4) { transform: translate(var(--u), var(--u)); animation-name: fold-4; }
  @keyframes fold-1 {   /* top left dot */
    0%, 3% { transform: translate(calc(var(--u) * 0.5), calc(var(--u) * -0.5)); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    9% { transform: translate(calc(var(--u) * 0.4), calc(var(--u) * -1)); animation-timing-function: cubic-bezier(.3, .6, .3, 1); }
    30%, 42% { transform: translate(calc(var(--u) * -1), calc(var(--u) * -1)); animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
    50%, 53% { transform: translate(calc(var(--u) * -1.5), calc(var(--u) * -1.5)); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    59% { transform: translate(calc(var(--u) * -1.1), calc(var(--u) * -1)); animation-timing-function: cubic-bezier(.3, .6, .3, 1); }
    80%, 92% { transform: translate(calc(var(--u) * -1), calc(var(--u) * -1)); animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
    100% { transform: translate(calc(var(--u) * 0.5), calc(var(--u) * -0.5)); }
  }
  @keyframes fold-2 {   /* top right dot */
    0%, 3% { transform: translate(calc(var(--u) * 1.5), calc(var(--u) * -1.5)); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    9% { transform: translate(calc(var(--u) * 1.1), calc(var(--u) * -1)); animation-timing-function: cubic-bezier(.3, .6, .3, 1); }
    30%, 42% { transform: translate(calc(var(--u) * 1), calc(var(--u) * -1)); animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
    50%, 53% { transform: translate(calc(var(--u) * 0.5), calc(var(--u) * 0.5)); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    59% { transform: translate(calc(var(--u) * -0.4), calc(var(--u) * -1)); animation-timing-function: cubic-bezier(.3, .6, .3, 1); }
    80%, 92% { transform: translate(calc(var(--u) * 1), calc(var(--u) * -1)); animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
    100% { transform: translate(calc(var(--u) * 1.5), calc(var(--u) * -1.5)); }
  }
  @keyframes fold-3 {   /* bottom left dot */
    0%, 3% { transform: translate(calc(var(--u) * -1.5), calc(var(--u) * 1.5)); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    9% { transform: translate(calc(var(--u) * -1.1), calc(var(--u) * 1)); animation-timing-function: cubic-bezier(.3, .6, .3, 1); }
    30%, 42% { transform: translate(calc(var(--u) * -1), calc(var(--u) * 1)); animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
    50%, 53% { transform: translate(calc(var(--u) * -0.5), calc(var(--u) * -0.5)); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    59% { transform: translate(calc(var(--u) * 0.4), calc(var(--u) * 1)); animation-timing-function: cubic-bezier(.3, .6, .3, 1); }
    80%, 92% { transform: translate(calc(var(--u) * -1), calc(var(--u) * 1)); animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
    100% { transform: translate(calc(var(--u) * -1.5), calc(var(--u) * 1.5)); }
  }
  @keyframes fold-4 {   /* bottom right dot */
    0%, 3% { transform: translate(calc(var(--u) * -0.5), calc(var(--u) * 0.5)); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    9% { transform: translate(calc(var(--u) * -0.4), calc(var(--u) * 1)); animation-timing-function: cubic-bezier(.3, .6, .3, 1); }
    30%, 42% { transform: translate(calc(var(--u) * 1), calc(var(--u) * 1)); animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
    50%, 53% { transform: translate(calc(var(--u) * 1.5), calc(var(--u) * 1.5)); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    59% { transform: translate(calc(var(--u) * 1.1), calc(var(--u) * 1)); animation-timing-function: cubic-bezier(.3, .6, .3, 1); }
    80%, 92% { transform: translate(calc(var(--u) * 1), calc(var(--u) * 1)); animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
    100% { transform: translate(calc(var(--u) * -0.5), calc(var(--u) * 0.5)); }
  }
  .spinner.small { --size: 18px; }
  .spinner.gone { visibility: hidden; }
  .detail { color: #8a97a6; margin-left: auto; font-size: 15px; max-width: 260px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ok .icon { color: #3ccf7a; } .off .icon { color: #8a97a6; }
  .run .icon { color: #4aa3ff; } .fail .icon, .fail .detail { color: #ff5c5c; }
  .warn .icon { color: #f2b33d; }
  #message { color: #f2b33d; font-size: 16px; margin-top: 12px; min-height: 1.2em; }
  pre { color: #ff8f8f; font-size: 11px; white-space: pre-wrap; margin: 8px 0 0;
    max-height: 130px; overflow: hidden; }
</style>
</head>
<body>
<div class="box">
  <div class="head"><span class="spinner" id="spin"><i></i><i></i><i></i><i></i></span><h1 id="title">Starting the kiosk…</h1></div>
  <ul id="steps"></ul>
  <div id="message"></div>
  <pre id="log"></pre>
</div>
<script>
  // main.js calls setStatus() as each part of the system comes up.
  const ICONS = { wait: "○", ok: "✓", off: "–", warn: "!", fail: "✗" };
  const SPIN = "<i></i><i></i><i></i><i></i>";
  window.setStatus = ({ title, steps, message, log }) => {
    document.getElementById("title").textContent = title;
    // The big spinner turns while things start; not once something has failed.
    const failed = steps.some(s => s.state === "fail");
    document.getElementById("spin").classList.toggle("gone", failed);
    // Rows are updated in place, so a spinning step keeps spinning smoothly and a
    // step that just finished pops its mark in.
    const list = document.getElementById("steps");
    while (list.children.length > steps.length) list.lastChild.remove();
    steps.forEach((s, n) => {
      let li = list.children[n];
      if (!li) {
        li = document.createElement("li");
        li.innerHTML = '<span class="icon"></span><span class="label"></span><span class="detail"></span>';
        list.append(li);
      }
      const [icon, label, detail] = li.children;
      label.textContent = s.label;
      detail.textContent = s.detail || "";
      if (li.className === s.state && icon.firstChild) return;
      li.className = s.state;
      if (s.state === "run") {
        icon.innerHTML = `<span class="spinner small">${SPIN}</span>`;
      } else {
        const mark = document.createElement("b");
        mark.textContent = ICONS[s.state] || "○";
        icon.replaceChildren(mark);
      }
    });
    document.getElementById("message").textContent = message || "";
    document.getElementById("log").textContent = log || "";
  };
</script>
</body>
</html>
