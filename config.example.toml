# Copy to config.toml and edit. Anything left out uses the default shown here.

[database]
host = "localhost"
port = 3306
user = "nfc_login"
password = "change-me"          # or set NFC_LOGIN_DB_PASSWORD instead
name = "nfc_login"

[hardware]
mode = "pi"                     # "pi" for the real reader + keypad, "simulated" for a PC

[hardware.nfc]
interface = "spi"               # how the PN532 is wired: "spi" (fastest), "i2c" or "uart"
spi_cs_pin = 5                  # BCM pin for the PN532's SS line (physical pin 29)
spi_baudrate = 1000000          # Hz; the PN532 allows up to 5 MHz, lower it for long wires
uart_port = "/dev/serial0"
tries = 4                       # attempts per block when a read or write fails part-way
write_tags = true               # write ID / time / rank / link onto the card after each scan
poll_timeout_seconds = 0.5

[hardware.buzzer]
enabled = true
pin = 12                        # BCM; physical pin 32, - to pin 34 (GND)
type = "active"                 # or "passive" (driven with a tone at `frequency`)
frequency = 2700
active_low = false              # true for modules that beep when the pin is LOW
key_clicks = true               # short click on each keypad press

# Change any pattern: milliseconds on, off, on, off... (defaults in nfc_login/hardware/buzzer.py)
[hardware.buzzer.patterns]
# sign_in = [70, 50, 70, 50, 180]

[hardware.keypad]
enabled = true
# BCM pin numbers from the Da Vinci Kit "2.1.5 Keypad" lesson, except that
# the lesson's GPIO 10 is SPI MOSI (the PN532 needs it), so that wire moves to GPIO 6.
rows = [18, 23, 24, 25]
cols = [6, 22, 27, 17]
keys = ["1", "2", "3", "A",
        "4", "5", "6", "B",
        "7", "8", "9", "C",
        "*", "0", "#", "D"]

[tag]
# Placeholder for the GitHub Pages site a phone opens when it taps the card.
site_url = "https://lunarcatowo.github.io/rpi-login-system/"

[attendance]
min_scan_interval_seconds = 10  # ignore the same card again within this window
max_session_hours = 12          # longer sessions are treated as a forgotten sign-out (0 credit)

[updates]
enabled = true                  # when online, check GitHub for a newer version
check_hours = 6                 # and show a small download icon by the clock if there is one

[ui]
fullscreen = true
width = 800
height = 480
leaderboard_size = 10
result_seconds = 6              # how long a scan result stays on screen
keypad_timeout_seconds = 30

[seasons]
archive_dir = "archive"         # CSV snapshots written on every season reset

[web]
# Live "who's here" page and admin page at http://<pi-address>:8080/
enabled = true
host = "0.0.0.0"
port = 8080
refresh_seconds = 3

# Teams. A user's ID is their team letter plus a number (A007), and "key" is
# the keypad key that starts typing it. "short" is the name on the kiosk's
# side panel (8 letters at most). Letter M is the mentors: leave out "key",
# their IDs are just a number (007). Up to 999 people per team.
[[sections]]
letter = "A"
name = "Robot"
short = "Robot"
key = "A"

[[sections]]
letter = "B"
name = "Impact"
short = "Impact"
key = "B"

[[sections]]
letter = "C"
name = "Sustainability"
short = "Sustain"
key = "C"

[[sections]]
letter = "D"
name = "Strategy"
short = "Strategy"
key = "D"

[[sections]]
letter = "M"
name = "Mentors"
short = "Mentor"
